<h1>On Pace</h1>
<p>On Pace is a personal fitness dashboard built by Maarten Gerritse for his own use. It reads his own activity, heart, sleep and fitness data from the Google Health API and shows it against his own training targets.</p>
<p>It is not offered to the public and has a single user.</p>
